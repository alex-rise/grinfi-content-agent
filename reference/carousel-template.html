<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Carousel template</title>
<!--
  One file, N slides. Two outputs from the same file:

  PDF for a LinkedIn document post (all slides, one command):
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
      --disable-gpu --no-pdf-header-footer --print-to-pdf=carousel.pdf \
      "file://$PWD/reference/carousel-template.html"

  PNGs for Instagram (one per slide, ?slide=N):
    for n in 1 2 3 4 5; do "/Applications/.../Google Chrome" --headless --disable-gpu \
      --screenshot=slide-$n.png --window-size=1080,1350 --force-device-scale-factor=2 \
      --hide-scrollbars "file://$PWD/reference/carousel-template.html?slide=$n"; done

  Edit SLIDES and BRAND below. Nothing else needs touching.
-->
<style>
  :root {
    /* ---- the only two brand settings ---- */
    --accent: #16a34a;
    --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
    /* ------------------------------------- */
    --ink: #10151c;
    --muted: #5b6673;
    --line: #e4e8ed;
    --bg: #ffffff;
  }
  @page { size: 1080px 1350px; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0;
      -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { font-family: var(--font); color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }

  .slide {
    width: 1080px; height: 1350px; padding: 88px;
    display: flex; flex-direction: column; position: relative;
    background: var(--bg); overflow: hidden;
    page-break-after: always; break-after: page;
  }
  .slide:last-child { page-break-after: auto; break-after: auto; }
  .slide::before { content: ""; position: absolute; left: 0; top: 0; width: 14px; height: 100%; background: var(--accent); }
  .content { flex: 1; display: flex; flex-direction: column; justify-content: center; }

  .kicker { font-size: 26px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  h2 { font-size: 72px; line-height: 1.08; font-weight: 800; letter-spacing: -.02em; margin-top: 14px; }
  h2 em { font-style: normal; color: var(--accent); }
  .body { font-size: 36px; line-height: 1.45; color: var(--muted); margin-top: 28px; max-width: 820px; }
  .body b { color: var(--ink); font-weight: 700; }

  /* cover: bigger type */
  .slide.cover h2 { font-size: 92px; }
  .slide.cover .body { font-size: 40px; margin-top: 36px; }

  /* dark slide, for the hook or the closing */
  .slide.dark { background: #10151c; color: #fff; }
  .slide.dark h2 { color: #fff; }
  .slide.dark .body { color: rgba(255,255,255,.72); }
  .slide.dark .body b { color: #fff; }
  .slide.dark .foot { border-top-color: rgba(255,255,255,.22); color: rgba(255,255,255,.6); }
  .slide.dark .foot b { color: #fff; }

  /* one big number */
  .figure { font-size: 240px; line-height: .9; font-weight: 800; letter-spacing: -.04em; color: var(--accent); margin-top: 20px; }

  /* numbered steps */
  ol { list-style: none; margin-top: 44px; display: flex; flex-direction: column; gap: 30px; }
  ol li { display: flex; gap: 26px; font-size: 36px; line-height: 1.3; }
  ol li i { font-style: normal; flex: 0 0 56px; width: 56px; height: 56px; border-radius: 50%;
            background: var(--accent); color: #fff; font-weight: 800; font-size: 30px;
            display: flex; align-items: center; justify-content: center; }

  .foot { margin-top: auto; padding-top: 34px; border-top: 2px solid var(--line);
          display: flex; justify-content: space-between; align-items: baseline;
          font-size: 26px; color: var(--muted); }
  .foot b { color: var(--ink); font-size: 28px; }
  .swipe::after { content: "swipe →"; }
</style>
</head>
<body>

<!-- ===== EDIT THE TEXT BELOW, NOTHING ELSE ===== -->
<script>
  const BRAND = { name: "Your Company", handle: "yoursite.com" };

  // Five to eight slides. The first TWO are the hook: the platform shows the
  // carousel a second time starting from slide two, so slide two must work alone.
  const SLIDES = [
    { kind: "cover", dark: true,
      kicker: "Measured",
      title: "The list was worth <em>twenty points</em>. The copy was worth three.",
      body: "Same message, two sources, 3,812 invites." },

    { kind: "text",
      kicker: "What everyone sells you",
      title: "Hooks, frameworks, the perfect opener",
      body: "We spent a year there too. It moves the number by about <b>three points</b>. Worth doing, and not where the result lives." },

    { kind: "number",
      kicker: "Same message, two lists",
      figure: "29.3%",
      body: "replies from a list built off a described portrait, with every profile read before it went in" },

    { kind: "number",
      kicker: "Same message, two lists",
      figure: "6.8%",
      body: "replies from a decent export with sensible filters - the kind most teams send to and consider fine" },

    { kind: "steps",
      kicker: "Why",
      title: "A filter is not a portrait",
      steps: [
        "The right person recognises the first sentence as being about them",
        "So they read the second one, and that is the whole game",
        "The best opener ever written does not fix being the wrong person"
      ] },

    { kind: "text", dark: true,
      kicker: "If your replies are under 10%",
      title: "Do not rewrite the message this week",
      body: "Take twenty rows of the list and check who is actually in it. Ten minutes, and it tells you whether the copy was ever the problem." }
  ];
  // ===== end of the text you edit =====
</script>

<script>
  const only = new URLSearchParams(location.search).get("slide");

  const render = (s, i, n) => {
    const foot = `<div class="foot"><b>${BRAND.name}</b><span class="${i < n - 1 ? "swipe" : ""}">${i === n - 1 ? BRAND.handle : ""}</span></div>`;
    let inner = "";
    if (s.kicker) inner += `<div class="kicker">${s.kicker}</div>`;
    if (s.title)  inner += `<h2>${s.title}</h2>`;
    if (s.kind === "number") inner += `<div class="figure">${s.figure}</div>`;
    if (s.body)   inner += `<div class="body">${s.body}</div>`;
    if (s.kind === "steps" && s.steps)
      inner += "<ol>" + s.steps.map((t, k) => `<li><i>${k + 1}</i><span>${t}</span></li>`).join("") + "</ol>";
    const cls = ["slide", s.kind === "cover" ? "cover" : "", s.dark ? "dark" : ""].join(" ").trim();
    return `<section class="${cls}"><div class="content">${inner}</div>${foot}</section>`;
  };

  const list = only ? [SLIDES[Number(only) - 1]].filter(Boolean) : SLIDES;
  document.body.insertAdjacentHTML("beforeend",
    list.map((s, i) => render(s, only ? Number(only) - 1 : i, SLIDES.length)).join(""));
  if (only) { document.documentElement.style.width = "1080px"; document.body.style.width = "1080px"; }
</script>
</body>
</html>
